openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary operations
  - name: workspaces
    description: Workspace (tenant) management and calendar feed
  - name: notifications
    description: In-app notification feed
  - name: clients
    description: Client records
  - name: cases
    description: Case records
  - name: payments
    description: Case payments
  - name: documents
    description: Case documents
  - name: trust
    description: Trust accounting ledger
  - name: signatures
    description: Signature requests and public signing
  - name: portal
    description: Public client portal (token access)
  - name: reports
    description: Reporting and exports
  - name: imports
    description: Legacy data import
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List workspaces
      description: >
        Returns the workspaces visible to the caller. With Clerk enabled this is
        the caller's active organization; in local demo mode it lists every
        workspace so the switcher can offer all of them.
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace
      description: >
        Creates a new tenant. When Clerk is enabled, pass the Clerk organization
        ID as externalId so the workspace lines up with the session's org claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "409":
          description: A workspace with that externalId already exists
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get the in-app notification feed
      responses:
        "200":
          description: Notification feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notifications"
  /calendar-feed:
    get:
      operationId: getCalendarFeed
      tags: [workspaces]
      summary: Get the workspace calendar feed details
      responses:
        "200":
          description: Calendar feed details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarFeed"
    post:
      operationId: regenerateCalendarFeed
      tags: [workspaces]
      summary: Regenerate the workspace calendar feed token
      responses:
        "200":
          description: Regenerated calendar feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarFeed"
  /calendar/{token}/feed.ics:
    get:
      operationId: getCalendarFeedFile
      tags: [workspaces]
      summary: Subscribe to the workspace calendar (ICS)
      description: Public endpoint — the token authorizes access.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ICS calendar
          content:
            text/calendar:
              schema:
                type: string
        "404":
          description: Unknown calendar token
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: number
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated client list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedClients"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Soft-delete a client
      description: Refuses with 409 while the client still has non-deleted cases.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Client deleted
        "404":
          description: Client not found
        "409":
          description: Client still has active cases
  /clients/{id}/portal:
    post:
      operationId: createPortalLink
      tags: [clients]
      summary: Issue or rotate a client portal link
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Portal link token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalLink"
        "404":
          description: Client not found
    delete:
      operationId: revokePortalLink
      tags: [clients]
      summary: Revoke a client portal link
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Portal link revoked
        "404":
          description: Client not found
  /clients/{id}/portal/email:
    post:
      operationId: sendPortalEmail
      tags: [clients]
      summary: Email the client their portal link
      description: Reuses the existing portal token (re-sending never rotates a link the client already has) and only issues a new token when none exists. Actual delivery requires RESEND_API_KEY on the server; without it the link is still generated and returned with emailed=false.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalEmailInput"
      responses:
        "200":
          description: Portal link details and whether the email was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalEmailResult"
        "404":
          description: Client not found
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: Search and filter cases
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: source
          schema:
            type: string
        - in: query
          name: outstanding
          schema:
            type: boolean
        - in: query
          name: clientId
          schema:
            type: string
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: number
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated case list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCases"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get case detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          description: Case not found
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update a case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdate"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
    delete:
      operationId: deleteCase
      tags: [cases]
      summary: Soft-delete a case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Case deleted
  /cases/{id}/payments:
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record a payment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /cases/{id}/payments/{paymentId}/void:
    patch:
      operationId: voidCasePayment
      tags: [payments]
      summary: Void a recorded payment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Updated case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          description: Payment or case not found
        "422":
          description: Payment already voided or is a refund
  /cases/{id}/payments/{paymentId}/refund:
    post:
      operationId: refundCasePayment
      tags: [payments]
      summary: Refund a recorded payment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number }
                date: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Updated case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          description: Payment or case not found
        "422":
          description: Refund exceeds the original payment or payment is voided/refunded
  /cases/{id}/notes:
    post:
      operationId: createNote
      tags: [cases]
      summary: Add a case note
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
  /cases/{id}/notes/{noteId}:
    patch:
      operationId: updateNote
      tags: [cases]
      summary: Edit a case note
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: noteId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Case or note not found
    delete:
      operationId: deleteNote
      tags: [cases]
      summary: Remove a case note
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: noteId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Note deleted
        "404":
          description: Case or note not found
  /cases/{id}/court-dates:
    post:
      operationId: createCourtDate
      tags: [cases]
      summary: Schedule a court date
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtDateInput"
      responses:
        "201":
          description: Created court date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtDate"
        "404":
          description: Case not found
  /cases/{id}/court-dates/{courtDateId}:
    delete:
      operationId: deleteCourtDate
      tags: [cases]
      summary: Remove a court date
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: courtDateId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Court date deleted
        "404":
          description: Case or court date not found
  /cases/{id}/documents:
    get:
      operationId: listCaseDocuments
      tags: [documents]
      summary: List documents attached to a case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "404":
          description: Case not found
    post:
      operationId: createDocument
      tags: [documents]
      summary: Attach a document to a case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "404":
          description: Case not found
  /cases/{id}/documents/{documentId}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Download a document
      description: Returns document metadata plus the base64 data URL payload.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: documentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContent"
        "404":
          description: Case or document not found
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Remove a document
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: documentId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document deleted
        "404":
          description: Case or document not found
  /cases/{id}/trust-entries:
    get:
      operationId: listTrustEntries
      tags: [trust]
      summary: List trust ledger entries for a case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Trust ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustLedger"
        "404":
          description: Case not found
    post:
      operationId: createTrustEntry
      tags: [trust]
      summary: Record a trust ledger entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustEntryInput"
      responses:
        "201":
          description: Created trust entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustEntry"
        "404":
          description: Case not found
        "422":
          description: Withdrawal or transfer exceeds the available trust balance
  /cases/{id}/trust-entries/{entryId}:
    delete:
      operationId: deleteTrustEntry
      tags: [trust]
      summary: Remove a trust ledger entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: entryId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Trust entry deleted
        "404":
          description: Case or trust entry not found
  /cases/{id}/signature-requests:
    get:
      operationId: listSignatureRequests
      tags: [signatures]
      summary: List signature requests for a case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signature request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureRequestList"
        "404":
          description: Case not found
    post:
      operationId: createSignatureRequest
      tags: [signatures]
      summary: Request a signature on a case document or agreement
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignatureRequestInput"
      responses:
        "201":
          description: Created signature request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureRequestSummary"
        "400":
          description: Provide either a documentId or agreementText
        "404":
          description: Case or document not found
  /cases/{id}/signature-requests/{requestId}:
    delete:
      operationId: deleteSignatureRequest
      tags: [signatures]
      summary: Remove a signature request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Signature request deleted
        "404":
          description: Case or signature request not found
  /portal/{token}:
    get:
      operationId: getPortalView
      tags: [portal]
      summary: Get a client's portal view
      description: Public endpoint — the token authorizes access.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Portal view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalView"
        "404":
          description: Unknown or revoked portal token
  /portal/{token}/documents/{documentId}:
    get:
      operationId: downloadPortalDocument
      tags: [portal]
      summary: Download a document via the portal
      description: Public endpoint — the token authorizes access.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - in: path
          name: documentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContent"
        "404":
          description: Unknown token or document
  /sign/{token}:
    get:
      operationId: getSignatureRequest
      tags: [signatures]
      summary: Get a signature request for signing
      description: Public endpoint — the token authorizes access.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signature request view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureRequestView"
        "404":
          description: Unknown signature token
    post:
      operationId: signSignatureRequest
      tags: [signatures]
      summary: Sign a signature request
      description: Public endpoint — the token authorizes access.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignaturePayload"
      responses:
        "204":
          description: Signed
        "404":
          description: Unknown signature token
        "409":
          description: Request already signed
  /reports/summary:
    get:
      operationId: getReportsSummary
      tags: [reports]
      summary: Get report summaries
      responses:
        "200":
          description: Report summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsSummary"
  /reports/outstanding.csv:
    get:
      operationId: exportOutstanding
      tags: [reports]
      summary: Export outstanding balances as CSV
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
  /imports/preview:
    post:
      operationId: previewImport
      tags: [imports]
      summary: Preview legacy rows for import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
  /imports/commit:
    post:
      operationId: commitImport
      tags: [imports]
      summary: Commit legacy rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Client:
      type: object
      required: [id, fullName, leadSourceChannel, createdAt, portalToken]
      properties:
        id: { type: string }
        fullName: { type: string }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        leadSourceChannel: { type: string }
        leadSourceDetail: { type: ["string", "null"] }
        portalToken:
          type: ["string", "null"]
          description: Active client-portal token, or null when no link is issued.
        createdAt: { type: string, format: date-time }
    ClientInput:
      type: object
      required: [fullName, leadSourceChannel]
      properties:
        fullName: { type: string, minLength: 1 }
        phone: { type: string }
        email: { type: string }
        leadSourceChannel: { type: string, minLength: 1 }
        leadSourceDetail: { type: string }
    ClientUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        phone: { type: string }
        email: { type: string }
        leadSourceChannel: { type: string, minLength: 1 }
        leadSourceDetail: { type: string }
    Case:
      type: object
